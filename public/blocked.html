<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access denied</title>
  <link rel="icon" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,400..700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #eceef2;
      --surface: #ffffff;
      --surface-2: #f5f6f9;
      --border: #e1e4eb;
      --border-bright: #c9cdd9;
      --text: #1a1d33;
      --text-dim: #555b75;
      --text-muted: #8a90a8;
      --accent: #d42a47;
      --accent-hover: #bb1f3b;
      --accent-soft: rgba(212, 42, 71, 0.09);
      --accent-ink: #ffffff;
      --violet: #6d4ae0;
      --green: #0b9468;
      --green-soft: rgba(11, 148, 104, 0.12);
      --red: #d42a47;
      --red-soft: rgba(212, 42, 71, 0.08);
      --shadow: 0 1px 2px rgba(26, 29, 51, 0.05);
      --font-sans: 'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-mono: 'Martian Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #10121a;
        --surface: #171a25;
        --surface-2: #1d2130;
        --border: #252938;
        --border-bright: #353a4c;
        --text: #e7e9f2;
        --text-dim: #a3a8c0;
        --text-muted: #6c7290;
        --accent: #ff5d78;
        --accent-hover: #ff7a90;
        --accent-soft: rgba(255, 93, 120, 0.12);
        --accent-ink: #2a0710;
        --violet: #a893ff;
        --green: #3fd3a1;
        --green-soft: rgba(63, 211, 161, 0.14);
        --red: #ff5d78;
        --red-soft: rgba(255, 93, 120, 0.12);
        --shadow: none;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px 28px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .code {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--red);
      background: var(--red-soft);
      border-radius: 999px;
      padding: 3px 10px;
      margin-bottom: 14px;
    }
    h1 { font-size: 1.35rem; font-weight: 600; margin-bottom: 8px; }
    p { color: var(--text-dim); font-size: 0.92rem; line-height: 1.5; }
    .domain { display: block; margin-top: 4px; font-family: var(--font-mono); color: var(--text); overflow-wrap: anywhere; }
    .retry {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .retry strong { color: var(--text); font-family: var(--font-mono); font-weight: 500; }
      code, .mono, [class*="domain"], pre { font-stretch: 87.5%; }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">Blocked</div>
    <h1>Access denied</h1>
    <p>Too many failed sign-in attempts for<span class="domain" id="domain"></span></p>
    <div class="retry" id="retry">Try again in <strong id="countdown">–</strong></div>
  </main>
  <script>
    const DOMAIN = '__DOMAIN__';
    let remaining = Number('__RETRY_AFTER__') || 0;
    document.getElementById('domain').textContent = DOMAIN;
    const countdown = document.getElementById('countdown');

    function fmt(s) {
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
      if (h) return `${h}h ${String(m).padStart(2, '0')}m`;
      if (m) return `${m}m ${String(sec).padStart(2, '0')}s`;
      return `${sec}s`;
    }
    function tick() {
      if (remaining <= 0) { location.reload(); return; }
      countdown.textContent = fmt(remaining);
      remaining--;
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
