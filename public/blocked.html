<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access denied</title>
  <link rel="icon" href="/favicon.svg">
  <style>
    :root {
      --bg: #0b0b10;
      --surface: #13131b;
      --border: #24242f;
      --text: #e6e6ee;
      --text-dim: #8a8a99;
      --text-muted: #5a5a68;
      --red: #ff4d6d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 24px;
      text-align: center;
    }
    .code {
      font: 600 0.75rem ui-monospace, 'SF Mono', monospace;
      color: var(--red);
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }
    h1 { font-size: 1.35rem; font-weight: 600; margin-bottom: 8px; }
    p { color: var(--text-dim); font-size: 0.92rem; line-height: 1.5; }
    .domain { display: block; margin-top: 4px; font-family: ui-monospace, 'SF Mono', monospace; color: var(--text); overflow-wrap: anywhere; }
    .retry {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .retry strong { color: var(--text); font-family: ui-monospace, 'SF Mono', monospace; font-weight: 500; }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">429 · BLOCKED</div>
    <h1>Access denied</h1>
    <p>Too many failed sign-in attempts for<span class="domain" id="domain"></span></p>
    <div class="retry" id="retry">Try again in <strong id="countdown">–</strong></div>
  </main>
  <script>
    const DOMAIN = '__DOMAIN__';
    let remaining = Number('__RETRY_AFTER__') || 0;
    document.getElementById('domain').textContent = DOMAIN;
    const countdown = document.getElementById('countdown');

    function fmt(s) {
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
      if (h) return `${h}h ${String(m).padStart(2, '0')}m`;
      if (m) return `${m}m ${String(sec).padStart(2, '0')}s`;
      return `${sec}s`;
    }
    function tick() {
      if (remaining <= 0) { location.reload(); return; }
      countdown.textContent = fmt(remaining);
      remaining--;
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
