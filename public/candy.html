<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register route · candy</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,400..700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #eceef2;
      --surface: #ffffff;
      --surface-2: #f5f6f9;
      --border: #e1e4eb;
      --border-bright: #c9cdd9;
      --text: #1a1d33;
      --text-dim: #555b75;
      --text-muted: #8a90a8;
      --accent: #d42a47;
      --accent-hover: #bb1f3b;
      --accent-soft: rgba(212, 42, 71, 0.09);
      --accent-ink: #ffffff;
      --violet: #6d4ae0;
      --green: #0b9468;
      --green-soft: rgba(11, 148, 104, 0.12);
      --red: #d42a47;
      --red-soft: rgba(212, 42, 71, 0.08);
      --shadow: 0 1px 2px rgba(26, 29, 51, 0.05);
      --font-sans: 'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-mono: 'Martian Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #10121a;
        --surface: #171a25;
        --surface-2: #1d2130;
        --border: #252938;
        --border-bright: #353a4c;
        --text: #e7e9f2;
        --text-dim: #a3a8c0;
        --text-muted: #6c7290;
        --accent: #ff5d78;
        --accent-hover: #ff7a90;
        --accent-soft: rgba(255, 93, 120, 0.12);
        --accent-ink: #2a0710;
        --violet: #a893ff;
        --green: #3fd3a1;
        --green-soft: rgba(63, 211, 161, 0.14);
        --red: #ff5d78;
        --red-soft: rgba(255, 93, 120, 0.12);
        --shadow: none;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .card-head {
      padding: 22px 24px 18px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
    }
    .brand-name { display: flex; align-items: center; gap: 8px; color: var(--text); }
    .brand a { color: var(--text-dim); text-decoration: none; font-weight: 500; align-self: center; }
    .brand a:hover { color: var(--accent); }
    .domain {
      font-size: 1.45rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      word-break: break-all;
    }
    .domain .tld { color: var(--text-muted); font-weight: 400; }
    .sub {
      margin-top: 6px;
      font-size: 0.88rem;
      color: var(--text-dim);
    }
    .sub .dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      margin-right: 6px;
      vertical-align: 1px;
    }
    form { padding: 20px 24px 24px; }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 3px;
      margin-bottom: 20px;
    }
    .tab {
      font: 500 0.85rem var(--font-sans);
      color: var(--text-dim);
      background: none;
      border: 0;
      border-radius: 6px;
      padding: 8px 0;
      cursor: pointer;
    }
    .tab.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.08), inset 0 0 0 1px var(--border); }
    .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .panel { display: none; }
    .panel.active { display: block; }
    .field { margin-bottom: 14px; }
    label.lbl {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    input[type=text] {
      width: 100%;
      font: 0.95rem var(--font-mono);
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border-bright);
      border-radius: 8px;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type=text]::placeholder { color: var(--text-muted); }
    input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 6px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip {
      font: 0.72rem var(--font-mono);
      color: var(--text-dim);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      cursor: pointer;
    }
    .chip:hover { color: var(--accent); border-color: var(--accent); }
    .options {
      border-top: 1px solid var(--border);
      margin-top: 18px;
      padding-top: 14px;
      display: grid;
      gap: 10px;
    }
    .opt { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
    .opt input { margin-top: 3px; accent-color: var(--accent); width: 15px; height: 15px; }
    .opt-title { font-size: 0.88rem; }
    .opt-desc { font-size: 0.75rem; color: var(--text-muted); }
    .btn {
      width: 100%;
      margin-top: 20px;
      font: 600 0.92rem var(--font-sans);
      color: var(--accent-ink);
      background: var(--accent);
      border: 0;
      border-radius: 8px;
      padding: 11px 0;
      cursor: pointer;
      transition: filter 0.15s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.55; cursor: progress; }
    a.btn { display: block; text-align: center; text-decoration: none; }
    .msg {
      display: none;
      margin-top: 14px;
      font-size: 0.85rem;
      padding: 10px 12px;
      border-radius: 8px;
    }
    .msg.show { display: block; }
    .msg.error { color: var(--red); background: var(--red-soft); border: 1px solid transparent; }
    .msg.ok { color: var(--green); background: var(--green-soft); border: 1px solid transparent; }
    .msg.info { color: var(--text-dim); background: var(--surface-2); border: 1px solid var(--border); }
      code, .mono, [class*="domain"], pre { font-stretch: 87.5%; }
  
    /* hostnames read as hostnames: one face, no single-word highlight */
    h1 .domain, h1 .domain-name { color: var(--text); font-family: var(--font-mono); font-stretch: 87.5%; font-weight: 600; letter-spacing: -0.02em; }
    h1 .tld-suffix { color: var(--text-muted); font-family: var(--font-mono); font-stretch: 87.5%; font-weight: 400; letter-spacing: -0.02em; }
    .panel-badge { text-transform: none !important; letter-spacing: 0 !important; }
      .brand-name { gap: 0; font-family: var(--font-mono); font-stretch: 112.5%; font-weight: 700; font-size: 17px; letter-spacing: -0.04em; color: var(--text); }
    .brand-name .dot { color: var(--accent); }
    .domain { font-family: var(--font-mono); font-stretch: 87.5%; }
  </style>
</head>
<body>
  <main class="card">
    <div class="card-head">
      <div class="brand"><span class="brand-name">candy<span class="dot">.</span></span><a href="https://portal.localhost" id="portalLink">Open portal</a></div>
      <div class="domain"><span id="domainName">…</span><span class="tld" id="domainTld"></span></div>
      <div class="sub"><span class="dot"></span>Not registered yet. Point it at a port or a command.</div>
    </div>

    <!-- Registering needs a login, and the login lives on the portal: link there -->
    <a class="btn" id="registerLink" href="https://portal.localhost">Register it on the portal</a>
    <div class="hint" id="registerHint">You'll log in if you haven't, and the portal opens with this name filled in.</div>
  </main>

  <script>
    const host = location.hostname;
    const TLD = host.endsWith('.candy') ? 'candy' : host.endsWith('.localhost') ? 'localhost' : null;
    const domainName = TLD ? host.slice(0, -(TLD.length + 1)) : host;
    // The daemon's name for this host (a .candy alias resolves to the local name)
    const siteName = (window.CANDY_VARS && window.CANDY_VARS.name) || domainName;
    document.getElementById('domainName').textContent = domainName;
    document.getElementById('domainTld').textContent = TLD ? '.' + TLD : '';
    document.title = `${domainName} · candy`;
    const portal = `https://portal.${TLD || 'localhost'}`;
    document.getElementById('portalLink').href = portal;
    document.getElementById('registerLink').href = `${portal}/?add=${encodeURIComponent(siteName)}`;
  </script>
</body>
</html>
