<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register route · candy</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b10;
      --surface: #13131b;
      --surface-2: #191923;
      --border: #24242f;
      --border-bright: #33333f;
      --text: #e6e6ee;
      --text-dim: #8a8a99;
      --text-muted: #5a5a68;
      --accent: #00d8f0;
      --accent-soft: rgba(0, 216, 240, 0.12);
      --green: #2ee67a;
      --red: #ff4d6d;
      --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
      --font-sans: 'Space Grotesk', system-ui, sans-serif;
      --radius: 10px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .card-head {
      padding: 22px 24px 18px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
    }
    .brand a { color: var(--text-dim); text-decoration: none; }
    .brand a:hover { color: var(--accent); }
    .domain {
      font-family: var(--font-mono);
      font-size: 1.35rem;
      font-weight: 700;
      word-break: break-all;
    }
    .domain .tld { color: var(--text-muted); font-weight: 400; }
    .sub {
      margin-top: 6px;
      font-size: 0.88rem;
      color: var(--text-dim);
    }
    .sub .dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      margin-right: 6px;
      vertical-align: 1px;
    }
    form { padding: 20px 24px 24px; }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      margin-bottom: 20px;
    }
    .tab {
      font: 500 0.85rem var(--font-sans);
      color: var(--text-dim);
      background: none;
      border: 0;
      border-radius: 6px;
      padding: 8px 0;
      cursor: pointer;
    }
    .tab.active { background: var(--surface-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--border-bright); }
    .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .panel { display: none; }
    .panel.active { display: block; }
    .field { margin-bottom: 14px; }
    label.lbl {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    input[type=text] {
      width: 100%;
      font: 0.95rem var(--font-mono);
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border-bright);
      border-radius: 8px;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type=text]::placeholder { color: var(--text-muted); }
    input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 6px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip {
      font: 0.72rem var(--font-mono);
      color: var(--text-dim);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      cursor: pointer;
    }
    .chip:hover { color: var(--accent); border-color: var(--accent); }
    .options {
      border-top: 1px solid var(--border);
      margin-top: 18px;
      padding-top: 14px;
      display: grid;
      gap: 10px;
    }
    .opt { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
    .opt input { margin-top: 3px; accent-color: var(--accent); width: 15px; height: 15px; }
    .opt-title { font-size: 0.88rem; }
    .opt-desc { font-size: 0.75rem; color: var(--text-muted); }
    .btn {
      width: 100%;
      margin-top: 20px;
      font: 600 0.92rem var(--font-sans);
      color: #04161a;
      background: var(--accent);
      border: 0;
      border-radius: 8px;
      padding: 11px 0;
      cursor: pointer;
      transition: filter 0.15s;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn:disabled { opacity: 0.55; cursor: progress; }
    .msg {
      display: none;
      margin-top: 14px;
      font-size: 0.85rem;
      padding: 10px 12px;
      border-radius: 8px;
    }
    .msg.show { display: block; }
    .msg.error { color: var(--red); background: rgba(255, 77, 109, 0.08); border: 1px solid rgba(255, 77, 109, 0.25); }
    .msg.ok { color: var(--green); background: rgba(46, 230, 122, 0.08); border: 1px solid rgba(46, 230, 122, 0.25); }
    .msg.info { color: var(--text-dim); background: var(--surface-2); border: 1px solid var(--border); }
  </style>
</head>
<body>
  <main class="card">
    <div class="card-head">
      <div class="brand"><span>candy-localhost</span><a href="https://portal.localhost" id="portalLink">open portal →</a></div>
      <div class="domain"><span id="domainName">…</span><span class="tld" id="domainTld"></span></div>
      <div class="sub"><span class="dot"></span>Not registered yet. Point it at a port or a command.</div>
    </div>

    <form id="registerForm" novalidate>
      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-mode="quick" role="tab" aria-selected="true">Existing port</button>
        <button type="button" class="tab" data-mode="lazy" role="tab" aria-selected="false">Start on demand</button>
      </div>

      <div class="panel active" data-panel="quick">
        <div class="field">
          <label class="lbl" for="portInput">Port or URL</label>
          <input type="text" id="portInput" placeholder="3000" autocomplete="off" spellcheck="false">
          <div class="hint">A local port, or an http(s) URL to proxy to.</div>
        </div>
      </div>

      <div class="panel" data-panel="lazy">
        <div class="field">
          <label class="lbl" for="cwdInput">Project folder</label>
          <input type="text" id="cwdInput" placeholder="~/projects/myapp" autocomplete="off" spellcheck="false">
        </div>
        <div class="field">
          <label class="lbl" for="cmdInput">Start command</label>
          <input type="text" id="cmdInput" placeholder="npm run dev" autocomplete="off" spellcheck="false">
          <div class="chips">
            <button type="button" class="chip" data-cmd="npm run dev">npm run dev</button>
            <button type="button" class="chip" data-cmd="bun dev">bun dev</button>
            <button type="button" class="chip" data-cmd="pnpm dev">pnpm dev</button>
            <button type="button" class="chip" data-cmd="yarn dev">yarn dev</button>
          </div>
          <div class="hint">The server starts when you visit the domain and its port is detected automatically.</div>
        </div>
      </div>

      <div class="options" id="routeOptions">
        <label class="opt">
          <input type="checkbox" id="persistent">
          <span><span class="opt-title">Pin route</span><br><span class="opt-desc">Keep it across daemon restarts.</span></span>
        </label>
        <label class="opt">
          <input type="checkbox" id="portal">
          <span><span class="opt-title">Open a portal</span><br><span class="opt-desc">Create a public Cloudflare tunnel link.</span></span>
        </label>
      </div>

      <button type="submit" class="btn" id="submitBtn">Register</button>
      <div class="msg" id="msg" role="status"></div>
    </form>
  </main>

  <script>
    const host = location.hostname;
    const TLD = host.endsWith('.candy') ? 'candy' : host.endsWith('.localhost') ? 'localhost' : null;
    const domainName = TLD ? host.slice(0, -(TLD.length + 1)) : host;
    document.getElementById('domainName').textContent = domainName;
    document.getElementById('domainTld').textContent = TLD ? '.' + TLD : '';
    document.title = `${domainName} · candy`;
    if (TLD) document.getElementById('portalLink').href = `https://portal.${TLD}`;

    // Rolling one-time-use tokens
    let currentToken = window.CANDY_TOKEN || null;

    async function refreshToken() {
      if (!currentToken) return;
      try {
        const res = await fetch('/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: currentToken })
        });
        if (res.ok) currentToken = (await res.json()).token;
      } catch (e) {
        console.error('Token refresh failed:', e);
      }
    }

    async function apiCall(endpoint, options = {}) {
      const headers = { ...options.headers, 'X-Candy-Token': currentToken };
      const res = await fetch(endpoint, { ...options, headers });
      if (res.ok) {
        await refreshToken();
      } else if (res.status === 401) {
        await refreshToken();
        if (currentToken) {
          headers['X-Candy-Token'] = currentToken;
          const retry = await fetch(endpoint, { ...options, headers });
          if (retry.ok) await refreshToken();
          return retry;
        }
      }
      return res;
    }

    async function errorFrom(res, fallback) {
      try {
        const data = await res.json();
        return data.details ? `${data.error}: ${data.details}` : (data.error || fallback);
      } catch { return fallback; }
    }

    const form = document.getElementById('registerForm');
    const portInput = document.getElementById('portInput');
    const cwdInput = document.getElementById('cwdInput');
    const cmdInput = document.getElementById('cmdInput');
    const submitBtn = document.getElementById('submitBtn');
    const msgEl = document.getElementById('msg');
    const portalBox = document.getElementById('portal');
    const persistentBox = document.getElementById('persistent');
    let mode = 'quick';

    function setMode(next) {
      mode = next;
      document.querySelectorAll('.tab').forEach(t => {
        const on = t.dataset.mode === next;
        t.classList.toggle('active', on);
        t.setAttribute('aria-selected', on);
      });
      document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.dataset.panel === next));
      // Route options only apply to an existing port
      document.getElementById('routeOptions').style.display = next === 'quick' ? '' : 'none';
      submitBtn.textContent = next === 'quick' ? 'Register' : 'Save and start';
      (next === 'quick' ? portInput : cwdInput).focus();
      showMsg('');
    }
    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setMode(t.dataset.mode)));
    document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => { cmdInput.value = c.dataset.cmd; cmdInput.focus(); }));

    function showMsg(text, kind = 'info') {
      msgEl.textContent = text;
      msgEl.className = text ? `msg show ${kind}` : 'msg';
    }

    function busy(on, text) {
      submitBtn.disabled = on;
      if (on && text) showMsg(text, 'info');
    }

    async function registerLazy() {
      const cwd = cwdInput.value.trim();
      const cmd = cmdInput.value.trim();
      if (!cwd) return showMsg('Enter a project folder.', 'error'), cwdInput.focus();
      if (!cmd) return showMsg('Enter a start command.', 'error'), cmdInput.focus();

      busy(true, 'Saving server config…');
      const configRes = await apiCall('/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: domainName, cwd, cmd }),
      });
      if (!configRes.ok) throw new Error(await errorFrom(configRes, 'Failed to save server config'));

      showMsg('Starting server…', 'info');
      const startRes = await apiCall(`/process/start/${encodeURIComponent(domainName)}`, { method: 'POST' });
      if (!startRes.ok) throw new Error(await errorFrom(startRes, 'Failed to start server'));

      showMsg('Server starting. Reloading…', 'ok');
      setTimeout(() => location.reload(), 1200);
    }

    async function registerQuick() {
      const value = portInput.value.trim();
      const isUrl = /^https?:\/\//.test(value);
      const port = isUrl ? null : Number(value);
      if (!isUrl && (!Number.isInteger(port) || port < 1 || port > 65535)) {
        showMsg('Enter a port between 1 and 65535, or an http(s) URL.', 'error');
        portInput.focus();
        return;
      }

      busy(true, 'Registering route…');
      const persistent = persistentBox.checked;
      const body = isUrl ? { name: domainName, target: value, persistent } : { name: domainName, port, persistent };
      const res = await apiCall('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error(await errorFrom(res, 'Failed to register route'));

      if (portalBox.checked) {
        showMsg('Route added. Opening portal…', 'info');
        const portalRes = await apiCall('/portal', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: domainName, port, openBrowser: true }),
        });
        if (!portalRes.ok) {
          showMsg(`Route added, but the portal failed: ${await errorFrom(portalRes, 'unknown error')}`, 'error');
          setTimeout(() => location.reload(), 2500);
          return;
        }
        showMsg('Route added. The portal link opens in a new tab once the tunnel is up.', 'ok');
        setTimeout(() => location.reload(), 2500);
        return;
      }

      showMsg('Route added. Reloading…', 'ok');
      setTimeout(() => location.reload(), 800);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      showMsg('');
      try {
        await (mode === 'quick' ? registerQuick() : registerLazy());
      } catch (err) {
        const unreachable = err instanceof TypeError;
        showMsg(unreachable ? "Can't reach the candy daemon. Is it running?" : err.message, 'error');
        submitBtn.disabled = false;
        return;
      }
      if (!msgEl.classList.contains('ok')) submitBtn.disabled = false;
    });

    portInput.focus();
  </script>
</body>
</html>
