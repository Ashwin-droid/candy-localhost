<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Crashed</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,400..700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #eceef2;
      --surface: #ffffff;
      --surface-2: #f5f6f9;
      --surface-3: #efeff3;
      --border: #e1e4eb;
      --border-bright: #c9cdd9;
      --text: #1a1d33;
      --text-dim: #555b75;
      --text-muted: #8a90a8;
      --accent: #d42a47;
      --accent-hover: #bb1f3b;
      --accent-soft: rgba(212, 42, 71, 0.09);
      --accent-ink: #ffffff;
      --violet: #6d4ae0;
      --green: #0b9468;
      --green-soft: rgba(11, 148, 104, 0.12);
      --red: #d42a47;
      --red-soft: rgba(212, 42, 71, 0.08);
      --yellow: #b7791f;
      --yellow-soft: rgba(183, 121, 31, 0.1);
      --blue: #3b6fd8;
      --blue-soft: rgba(59, 111, 216, 0.1);
      --shadow: 0 1px 2px rgba(26, 29, 51, 0.05);
      --log-bg: #0e0e12;
      --log-text: #e4e4ea;
      /* legacy names used by this page's rules */
      --bg-deep: var(--bg); --bg-surface: var(--surface); --bg-card: var(--surface); --bg-elevated: var(--surface-2);
      --dim: var(--text-dim);
      --cyan: var(--accent); --cyan-dim: var(--accent-hover); --cyan-glow: var(--accent-soft);
      --magenta: var(--accent); --magenta-dim: var(--accent-hover); --magenta-glow: var(--accent-soft);
      --green-dim: var(--green); --red-dim: var(--red); --red-glow: var(--red-soft);
      --font-sans: 'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-mono: 'Martian Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #10121a;
        --surface: #171a25;
        --surface-2: #1d2130;
        --surface-3: #25252b;
        --border: #252938;
        --border-bright: #353a4c;
        --text: #e7e9f2;
        --text-dim: #a3a8c0;
        --text-muted: #6c7290;
        --accent: #ff5d78;
        --accent-hover: #ff7a90;
        --accent-soft: rgba(255, 93, 120, 0.12);
        --accent-ink: #2a0710;
        --violet: #a893ff;
        --green: #3fd3a1;
        --green-soft: rgba(63, 211, 161, 0.14);
        --red: #ff5d78;
        --red-soft: rgba(255, 93, 120, 0.12);
        --yellow: #f2b84b;
        --yellow-soft: rgba(242, 184, 75, 0.12);
        --blue: #74a0ff;
        --blue-soft: rgba(116, 160, 255, 0.12);
        --shadow: none;
        --log-bg: #0b0b0e;
        --log-text: #e4e4ea;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      background: var(--bg-deep);
      color: var(--text);
      padding: 1.5rem;
      overflow-x: hidden;
    }



    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--red-soft);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .error-icon {
      width: 44px;
      height: 44px;
      background: var(--red);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      animation: errorPulse 2s ease-in-out infinite;
    }

    @keyframes errorPulse {
      0%, 100% { box-shadow: var(--shadow); }
      50% { box-shadow: var(--shadow); }
    }

    .error-icon svg {
      width: 24px;
      height: 24px;
      stroke: white;
      stroke-width: 3;
      fill: none;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text);
    }

    .domain {
      color: var(--red);
    }

    .exit-badge {
      font-family: var(--font-sans);
      font-size: 0.8rem;
      padding: 0.5rem 1rem;
      background: var(--red-glow);
      border: 1px solid var(--red-soft);
      border-radius: 20px;
      color: var(--red);
    }

    .logs-panel {
      background: var(--bg-surface);
      border: 1px solid var(--red-soft);
      border-radius: 12px;
      overflow: hidden;
      height: 50vh;
      min-height: 300px;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.875rem 1rem;
      background: var(--red-soft);
      border-bottom: 1px solid var(--red-soft);
    }

    .panel-title {
      font-size: 0.75rem;
      letter-spacing: 0;
      color: var(--red);
    }

    .panel-badge {
      font-size: 0.65rem;
      padding: 0.25rem 0.5rem;
      background: var(--bg-card);
      border-radius: 4px;
      color: var(--text-muted);
    }

    .logs-content {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      font-size: 0.8rem;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--text-dim);
    }

    .logs-content::-webkit-scrollbar {
      width: 6px;
    }

    .logs-content::-webkit-scrollbar-track {
      background: transparent;
    }

    .logs-content::-webkit-scrollbar-thumb {
      background: var(--border-bright);
      border-radius: 3px;
    }

    .actions {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.875rem 1.5rem;
      border-radius: 8px;
      font-family: var(--font-sans);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      border: none;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-ink);
      color: var(--bg-deep);
      box-shadow: var(--shadow);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
    }

    .btn-secondary:hover {
      border-color: var(--border-bright);
      color: var(--text);
    }

    .tips {
      margin-top: 2rem;
      padding: 1.25rem;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .tips-title {
      font-size: 0.7rem;
      letter-spacing: 0;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .tips-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.75rem;
    }

    .tip {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .tip-icon {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: var(--cyan);
    }
      code, .mono, [class*="domain"], pre { font-stretch: 87.5%; }
  
    /* hostnames read as hostnames: one face, no single-word highlight */
    h1 .domain, h1 .domain-name { color: var(--text); font-family: var(--font-mono); font-stretch: 87.5%; font-weight: 600; letter-spacing: -0.02em; }
    h1 .tld-suffix { color: var(--text-muted); font-family: var(--font-mono); font-stretch: 87.5%; font-weight: 400; letter-spacing: -0.02em; }
    .panel-badge { text-transform: none !important; letter-spacing: 0 !important; }
      .tip::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; margin-top: 0.55em; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-left">
        <h1><span class="domain" id="serverName">server</span><span class="tld-suffix">.localhost</span> crashed</h1>
      </div>
      <div class="exit-badge" id="exitBadge">exit 1</div>
    </header>

    <div class="logs-panel">
      <div class="panel-header">
        <span class="panel-title">Output</span>
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <a class="panel-badge" id="terminalLink" href="#" style="background: var(--accent-soft); color: var(--cyan); border: 1px solid var(--accent-soft); text-decoration: none;" title="Typing into the process needs a login: it opens on the portal">Type into it on the portal</a>
          <span class="panel-badge">Last 100 lines</span>
        </div>
      </div>
      <div class="logs-content" id="logsContent">Loading logs...</div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="restartBtn" onclick="restartServer()">
        Restart
      </button>
      <a href="#" class="btn btn-secondary" id="portalLink">Back to portal</a>
    </div>

    <div class="tips">
      <div class="tips-title">Common causes</div>
      <div class="tips-grid">
        <div class="tip">
          <span>Port already in use by another process</span>
        </div>
        <div class="tip">
          <span>Missing dependencies (npm install)</span>
        </div>
        <div class="tip">
          <span>Invalid configuration or syntax errors</span>
        </div>
        <div class="tip">
          <span>Permission issues with files or directories</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = '';
    const _host = location.hostname;
    const _isBoundDomain = !_host.endsWith('.candy') && !_host.endsWith('.localhost');
    const TLD = _host.endsWith('.candy') ? 'candy' : _host.endsWith('.localhost') ? 'localhost' : null;
    const SCHEME = 'https';
    const vars = window.CANDY_VARS || { name: 'unknown', exitCode: 1, status: 'errored' };
    const serverName = vars.name;
    const escapedServerName = serverName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const candySuffix = TLD ? '.' + TLD : '';
    const getServiceHost = () => {
      if (_isBoundDomain || !TLD) return location.host;  // keeps a :port (ts.net HTTPS)
      const left = _host.endsWith(candySuffix) ? _host.slice(0, -candySuffix.length) : _host;
      const actionMatch = left.match(new RegExp(`^${escapedServerName}\\.(?:kill|k|portal|p)(?:\\.(.+))?$`));
      if (!actionMatch) return _host;
      return actionMatch[1] ? `${serverName}.${actionMatch[1]}${candySuffix}` : `${serverName}${candySuffix}`;
    };
    const getServiceUrl = () => `${SCHEME}://${getServiceHost()}`;

    // This page acts only on its own site, from its own host (the daemon's
    // siteAction); anything else needs a login, which lives on the portal
    // The site token the daemon put in this page: start and restart this site, nothing else
    const apiCall = (endpoint, options = {}) => fetch(API + endpoint, {
      ...options,
      headers: { ...(options.headers || {}), 'X-Candy-Token': window.CANDY_TOKEN || '' },
    });
    const portalBase = `${SCHEME}://portal.${_isBoundDomain ? 'localhost' : TLD}`;
    document.getElementById('terminalLink').href = `${portalBase}/?logs=${encodeURIComponent(serverName)}`;

    document.getElementById('serverName').textContent = serverName;
    document.getElementById('exitBadge').textContent = `exit ${vars.exitCode ?? '?'}`;

    // Fetch logs via SSE
    async function loadLogs() {
      const logsEl = document.getElementById('logsContent');
      try {
        const eventSource = new EventSource(API + `/stream/${serverName}`);
        let content = '';

        eventSource.onmessage = (event) => {
          content += JSON.parse(event.data);
          const lines = content.split('\n');
          logsEl.textContent = lines.slice(-100).join('\n');
          logsEl.scrollTop = logsEl.scrollHeight;
        };

        // Close after 2 seconds (just get initial content)
        setTimeout(() => eventSource.close(), 2000);
      } catch (e) {
        logsEl.textContent = 'Failed to load logs: ' + e.message;
      }
    }

    loadLogs();

    async function restartServer() {
      const btn = document.getElementById('restartBtn');
      btn.disabled = true;
      btn.innerHTML = '<span>Restarting...</span>';

      try {
        const res = await apiCall(`/process/restart/${serverName}`, {
          method: 'POST'
        });

        if (res.ok) {
          location.href = getServiceUrl();
        } else {
          const data = await res.json();
          alert('Failed to restart: ' + (data.error || 'Unknown error'));
          btn.disabled = false;
          btn.innerHTML = 'Restart';
        }
      } catch (e) {
        alert('Failed to restart: ' + e.message);
        btn.disabled = false;
        btn.innerHTML = 'Restart';
      }
    }

    // Update TLD-dependent elements
    document.querySelectorAll('.tld-suffix').forEach(el => el.textContent = _isBoundDomain ? '' : '.' + TLD);
    if (_isBoundDomain) document.getElementById('serverName').textContent = _host;
    document.getElementById('portalLink').href = portalBase;
  </script>
</body>
</html>
