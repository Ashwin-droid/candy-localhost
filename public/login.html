<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Required</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f6f8;
      --surface: #ffffff;
      --surface-2: #f8f8fa;
      --surface-3: #efeff3;
      --border: #e6e6eb;
      --border-bright: #d9d9e0;
      --text: #18181b;
      --text-dim: #5f5f6b;
      --text-muted: #8e8e99;
      --accent: #d6336c;
      --accent-hover: #c2255c;
      --accent-soft: rgba(214, 51, 108, 0.09);
      --accent-ink: #ffffff;
      --violet: #8b5cf6;
      --green: #1f9d55;
      --green-soft: rgba(31, 157, 85, 0.1);
      --red: #d92d3f;
      --red-soft: rgba(217, 45, 63, 0.08);
      --yellow: #b7791f;
      --yellow-soft: rgba(183, 121, 31, 0.1);
      --blue: #3b6fd8;
      --blue-soft: rgba(59, 111, 216, 0.1);
      --shadow: 0 1px 2px rgba(16, 16, 24, 0.04), 0 8px 24px rgba(16, 16, 24, 0.06);
      --log-bg: #0e0e12;
      --log-text: #e4e4ea;
      /* legacy names used by this page's rules */
      --bg-deep: var(--bg); --bg-surface: var(--surface); --bg-card: var(--surface); --bg-elevated: var(--surface-2);
      --dim: var(--text-dim);
      --cyan: var(--accent); --cyan-dim: var(--accent-hover); --cyan-glow: var(--accent-soft);
      --magenta: var(--accent); --magenta-dim: var(--accent-hover); --magenta-glow: var(--accent-soft);
      --green-dim: var(--green); --red-dim: var(--red); --red-glow: var(--red-soft);
      --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #0f0f12;
        --surface: #17171b;
        --surface-2: #1c1c21;
        --surface-3: #25252b;
        --border: #26262c;
        --border-bright: #33333a;
        --text: #ececf1;
        --text-dim: #a1a1ab;
        --text-muted: #6e6e78;
        --accent: #f06595;
        --accent-hover: #f783ac;
        --accent-soft: rgba(240, 101, 149, 0.12);
        --accent-ink: #1a0b11;
        --violet: #a78bfa;
        --green: #3ecf7e;
        --green-soft: rgba(62, 207, 126, 0.12);
        --red: #ff6b7a;
        --red-soft: rgba(255, 107, 122, 0.12);
        --yellow: #f2b84b;
        --yellow-soft: rgba(242, 184, 75, 0.12);
        --blue: #74a0ff;
        --blue-soft: rgba(116, 160, 255, 0.12);
        --shadow: none;
        --log-bg: #0b0b0e;
        --log-text: #e4e4ea;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      background: var(--bg-deep);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }



    .container {
      text-align: center;
      max-width: 400px;
      width: 100%;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .candy-icon {
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
      filter: drop-shadow(0 0 20px var(--magenta-glow));
    }

    h1 {
      font-family: var(--font-sans);
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.4rem;
    }

    .domain-name {
      color: var(--magenta);
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 2rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .input-wrapper {
      position: relative;
    }

    input[type="password"] {
      width: 100%;
      padding: 1rem 1.2rem;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="password"]:focus {
      border-color: var(--cyan-dim);
      box-shadow: var(--shadow);
    }

    input[type="password"]::placeholder {
      color: var(--text-muted);
    }

    .btn-submit {
      padding: 1rem;
      background: var(--accent);
      color: var(--accent-ink);
      color: var(--bg-deep);
      border: none;
      border-radius: 10px;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow);
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .error-msg {
      color: var(--red);
      font-size: 0.85rem;
      min-height: 1.2em;
      margin-top: 0.25rem;
    }

    .backoff-timer {
      display: none;
      margin-top: 1rem;
      padding: 1rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-dim);
      font-size: 0.85rem;
    }

    .backoff-timer.visible { display: block; }

    .backoff-timer .countdown {
      color: var(--magenta);
      font-size: 1.5rem;
      font-weight: 700;
      font-family: var(--font-sans);
      margin-top: 0.5rem;
    }

    .footer {
      margin-top: 2.5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="candy-icon">&#127852;</div>

    <h1><span class="domain-name" id="domainDisplay">domain</span></h1>
    <p class="subtitle">Enter the password to continue</p>

    <form id="loginForm" method="POST" action="/candy-auth/login">
      <div class="input-wrapper">
        <input type="password" name="password" id="passwordInput" placeholder="Password" autocomplete="off" autofocus>
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">Sign in</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>

    <div class="backoff-timer" id="backoffTimer">
      <div>Too many attempts. Try again in</div>
      <div class="countdown" id="countdownDisplay">0s</div>
    </div>

    <div class="footer">
      <p>&#127852; candy-localhost</p>
    </div>
  </div>

  <script>
    const DOMAIN = '__DOMAIN__';
    const SUBDOMAIN = '__SUBDOMAIN__';
    const BLOCKED = __BLOCKED__;
    let RETRY_AFTER = __RETRY_AFTER__;

    document.getElementById('domainDisplay').textContent = DOMAIN;

    const form = document.getElementById('loginForm');
    const passwordInput = document.getElementById('passwordInput');
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');
    const backoffTimer = document.getElementById('backoffTimer');
    const countdownDisplay = document.getElementById('countdownDisplay');

    let countdownInterval = null;

    function startCountdown(seconds) {
      submitBtn.disabled = true;
      passwordInput.disabled = true;
      backoffTimer.classList.add('visible');
      let remaining = seconds;
      countdownDisplay.textContent = remaining + 's';

      countdownInterval = setInterval(() => {
        remaining--;
        countdownDisplay.textContent = remaining + 's';
        if (remaining <= 0) {
          clearInterval(countdownInterval);
          submitBtn.disabled = false;
          passwordInput.disabled = false;
          backoffTimer.classList.remove('visible');
          passwordInput.focus();
        }
      }, 1000);
    }

    if (BLOCKED && RETRY_AFTER > 0) {
      startCountdown(RETRY_AFTER);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';
      submitBtn.disabled = true;

      const password = passwordInput.value;
      if (!password) {
        errorMsg.textContent = 'Enter a password';
        submitBtn.disabled = false;
        return;
      }

      try {
        const res = await fetch('/candy-auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
          redirect: 'manual',
        });

        if (res.type === 'opaqueredirect' || res.status === 302 || res.status === 0) {
          window.location.reload();
          return;
        }

        if (res.ok) {
          window.location.reload();
          return;
        }

        const data = await res.json();
        errorMsg.textContent = data.error || 'Wrong password';
        passwordInput.value = '';
        passwordInput.focus();

        if (data.retryAfter > 0) {
          startCountdown(data.retryAfter);
        } else {
          submitBtn.disabled = false;
        }
      } catch (err) {
        errorMsg.textContent = "Couldn't reach the server";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
