<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Required</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,400..700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #eceef2;
      --surface: #ffffff;
      --surface-2: #f5f6f9;
      --surface-3: #efeff3;
      --border: #e1e4eb;
      --border-bright: #c9cdd9;
      --text: #1a1d33;
      --text-dim: #555b75;
      --text-muted: #8a90a8;
      --accent: #d42a47;
      --accent-hover: #bb1f3b;
      --accent-soft: rgba(212, 42, 71, 0.09);
      --accent-ink: #ffffff;
      --violet: #6d4ae0;
      --green: #0b9468;
      --green-soft: rgba(11, 148, 104, 0.12);
      --red: #d42a47;
      --red-soft: rgba(212, 42, 71, 0.08);
      --yellow: #b7791f;
      --yellow-soft: rgba(183, 121, 31, 0.1);
      --blue: #3b6fd8;
      --blue-soft: rgba(59, 111, 216, 0.1);
      --shadow: 0 1px 2px rgba(26, 29, 51, 0.05);
      --log-bg: #0e0e12;
      --log-text: #e4e4ea;
      /* legacy names used by this page's rules */
      --bg-deep: var(--bg); --bg-surface: var(--surface); --bg-card: var(--surface); --bg-elevated: var(--surface-2);
      --dim: var(--text-dim);
      --cyan: var(--accent); --cyan-dim: var(--accent-hover); --cyan-glow: var(--accent-soft);
      --magenta: var(--accent); --magenta-dim: var(--accent-hover); --magenta-glow: var(--accent-soft);
      --green-dim: var(--green); --red-dim: var(--red); --red-glow: var(--red-soft);
      --font-sans: 'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-mono: 'Martian Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #10121a;
        --surface: #171a25;
        --surface-2: #1d2130;
        --surface-3: #25252b;
        --border: #252938;
        --border-bright: #353a4c;
        --text: #e7e9f2;
        --text-dim: #a3a8c0;
        --text-muted: #6c7290;
        --accent: #ff5d78;
        --accent-hover: #ff7a90;
        --accent-soft: rgba(255, 93, 120, 0.12);
        --accent-ink: #2a0710;
        --violet: #a893ff;
        --green: #3fd3a1;
        --green-soft: rgba(63, 211, 161, 0.14);
        --red: #ff5d78;
        --red-soft: rgba(255, 93, 120, 0.12);
        --yellow: #f2b84b;
        --yellow-soft: rgba(242, 184, 75, 0.12);
        --blue: #74a0ff;
        --blue-soft: rgba(116, 160, 255, 0.12);
        --shadow: none;
        --log-bg: #0b0b0e;
        --log-text: #e4e4ea;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      background: var(--bg-deep);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }



    .container {
      text-align: center;
      max-width: 400px;
      width: 100%;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .candy-icon {
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
      filter: drop-shadow(0 0 20px var(--magenta-glow));
    }

    h1 {
      font-family: var(--font-sans);
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.4rem;
    }

    .domain-name {
      color: var(--magenta);
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 2rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .input-wrapper {
      position: relative;
    }

    input[type="password"] {
      width: 100%;
      padding: 1rem 1.2rem;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="password"]:focus {
      border-color: var(--cyan-dim);
      box-shadow: var(--shadow);
    }

    input[type="password"]::placeholder {
      color: var(--text-muted);
    }

    .btn-submit {
      padding: 1rem;
      background: var(--accent);
      color: var(--accent-ink);
      color: var(--bg-deep);
      border: none;
      border-radius: 10px;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow);
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .error-msg {
      color: var(--red);
      font-size: 0.85rem;
      min-height: 1.2em;
      margin-top: 0.25rem;
    }

    .backoff-timer {
      display: none;
      margin-top: 1rem;
      padding: 1rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-dim);
      font-size: 0.85rem;
    }

    .backoff-timer.visible { display: block; }

    .backoff-timer .countdown {
      color: var(--magenta);
      font-size: 1.5rem;
      font-weight: 700;
      font-family: var(--font-sans);
      margin-top: 0.5rem;
    }

    .footer {
      margin-top: 2.5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
      code, .mono, [class*="domain"], pre { font-stretch: 87.5%; }
  
    /* hostnames read as hostnames: one face, no single-word highlight */
    h1 .domain, h1 .domain-name { color: var(--text); font-family: var(--font-mono); font-stretch: 87.5%; font-weight: 600; letter-spacing: -0.02em; }
    h1 .tld-suffix { color: var(--text-muted); font-family: var(--font-mono); font-stretch: 87.5%; font-weight: 400; letter-spacing: -0.02em; }
    .panel-badge { text-transform: none !important; letter-spacing: 0 !important; }
  </style>
</head>
<body>

  <div class="container">
    <h1><span class="domain-name" id="domainDisplay">domain</span></h1>
    <p class="subtitle">Enter the password to continue</p>

    <form id="loginForm" method="POST" action="/candy-auth/login">
      <div class="input-wrapper">
        <input type="password" name="password" id="passwordInput" placeholder="Password" autocomplete="off" autofocus>
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">Sign in</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>

    <div class="backoff-timer" id="backoffTimer">
      <div>Too many attempts. Try again in</div>
      <div class="countdown" id="countdownDisplay">0s</div>
    </div>

    <div class="footer">
      <p>&#127852; candy-localhost</p>
    </div>
  </div>

  <script>
    const DOMAIN = '__DOMAIN__';
    const SUBDOMAIN = '__SUBDOMAIN__';
    const BLOCKED = __BLOCKED__;
    let RETRY_AFTER = __RETRY_AFTER__;

    document.getElementById('domainDisplay').textContent = DOMAIN;

    const form = document.getElementById('loginForm');
    const passwordInput = document.getElementById('passwordInput');
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');
    const backoffTimer = document.getElementById('backoffTimer');
    const countdownDisplay = document.getElementById('countdownDisplay');

    let countdownInterval = null;

    function startCountdown(seconds) {
      submitBtn.disabled = true;
      passwordInput.disabled = true;
      backoffTimer.classList.add('visible');
      let remaining = seconds;
      countdownDisplay.textContent = remaining + 's';

      countdownInterval = setInterval(() => {
        remaining--;
        countdownDisplay.textContent = remaining + 's';
        if (remaining <= 0) {
          clearInterval(countdownInterval);
          submitBtn.disabled = false;
          passwordInput.disabled = false;
          backoffTimer.classList.remove('visible');
          passwordInput.focus();
        }
      }, 1000);
    }

    if (BLOCKED && RETRY_AFTER > 0) {
      startCountdown(RETRY_AFTER);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';
      submitBtn.disabled = true;

      const password = passwordInput.value;
      if (!password) {
        errorMsg.textContent = 'Enter a password';
        submitBtn.disabled = false;
        return;
      }

      try {
        const res = await fetch('/candy-auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
          redirect: 'manual',
        });

        if (res.type === 'opaqueredirect' || res.status === 302 || res.status === 0) {
          window.location.reload();
          return;
        }

        if (res.ok) {
          window.location.reload();
          return;
        }

        const data = await res.json();
        errorMsg.textContent = data.error || 'Wrong password';
        passwordInput.value = '';
        passwordInput.focus();

        if (data.retryAfter > 0) {
          startCountdown(data.retryAfter);
        } else {
          submitBtn.disabled = false;
        }
      } catch (err) {
        errorMsg.textContent = "Couldn't reach the server";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
