<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>candy network</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f6f8;
      --surface: #ffffff;
      --surface-2: #f8f8fa;
      --surface-3: #efeff3;
      --border: #e6e6eb;
      --border-bright: #d9d9e0;
      --text: #18181b;
      --text-dim: #5f5f6b;
      --text-muted: #8e8e99;
      --accent: #d6336c;
      --accent-hover: #c2255c;
      --accent-soft: rgba(214, 51, 108, 0.09);
      --accent-ink: #ffffff;
      --violet: #8b5cf6;
      --green: #1f9d55;
      --green-soft: rgba(31, 157, 85, 0.1);
      --red: #d92d3f;
      --red-soft: rgba(217, 45, 63, 0.08);
      --yellow: #b7791f;
      --yellow-soft: rgba(183, 121, 31, 0.1);
      --blue: #3b6fd8;
      --blue-soft: rgba(59, 111, 216, 0.1);
      --shadow: 0 1px 2px rgba(16, 16, 24, 0.04), 0 8px 24px rgba(16, 16, 24, 0.06);
      --log-bg: #0e0e12;
      --log-text: #e4e4ea;
      /* legacy names used by this page's rules */
      --bg-deep: var(--bg); --bg-surface: var(--surface); --bg-card: var(--surface); --bg-elevated: var(--surface-2);
      --dim: var(--text-dim);
      --cyan: var(--accent); --cyan-dim: var(--accent-hover); --cyan-glow: var(--accent-soft);
      --magenta: var(--accent); --magenta-dim: var(--accent-hover); --magenta-glow: var(--accent-soft);
      --green-dim: var(--green); --red-dim: var(--red); --red-glow: var(--red-soft);
      --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #0f0f12;
        --surface: #17171b;
        --surface-2: #1c1c21;
        --surface-3: #25252b;
        --border: #26262c;
        --border-bright: #33333a;
        --text: #ececf1;
        --text-dim: #a1a1ab;
        --text-muted: #6e6e78;
        --accent: #f06595;
        --accent-hover: #f783ac;
        --accent-soft: rgba(240, 101, 149, 0.12);
        --accent-ink: #1a0b11;
        --violet: #a78bfa;
        --green: #3ecf7e;
        --green-soft: rgba(62, 207, 126, 0.12);
        --red: #ff6b7a;
        --red-soft: rgba(255, 107, 122, 0.12);
        --yellow: #f2b84b;
        --yellow-soft: rgba(242, 184, 75, 0.12);
        --blue: #74a0ff;
        --blue-soft: rgba(116, 160, 255, 0.12);
        --shadow: none;
        --log-bg: #0b0b0e;
        --log-text: #e4e4ea;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      background: var(--bg-deep);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }


    .logo {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo-text {
      font-family: var(--font-sans);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--cyan);
    }

    .logo-sub {
      font-size: 0.7rem;
      color: var(--text-dim);
      letter-spacing: 0;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: var(--shadow);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    main {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    .section {
      margin-bottom: 2rem;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .section-title {
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0;
    }

    .section-count {
      font-size: 0.7rem;
      color: var(--text-muted);
      background: var(--bg-elevated);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .record-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .record {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      transition: border-color 0.15s;
    }

    .record:hover {
      border-color: var(--border-bright);
    }

    .record-name {
      font-size: 0.85rem;
      color: var(--cyan);
    }

    .record-name .tld {
      color: var(--text-dim);
    }

    .record-details {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      margin-top: 0.35rem;
    }

    .record-domain,
    .record-host {
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    .record-domain strong,
    .record-host strong {
      color: var(--text);
      font-weight: 600;
    }

    .record-ip {
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .record-meta {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .record-expiry {
      font-size: 0.7rem;
      color: var(--yellow);
    }

    .tag {
      font-size: 0.65rem;
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
      letter-spacing: 0;
    }

    .tag-local {
      background: var(--green-soft);
      color: var(--green);
      border: 1px solid var(--green-soft);
    }

    .tag-remote {
      background: var(--accent-soft);
      color: var(--magenta);
      border: 1px solid var(--accent-soft);
    }

    .tag-canonical {
      background: var(--accent-soft);
      color: var(--cyan);
      border: 1px solid var(--accent-soft);
    }

    .tag-alias {
      background: var(--yellow-soft);
      color: var(--yellow);
      border: 1px solid var(--yellow-soft);
    }

    .tag-shadowed {
      background: var(--surface-3);
      color: var(--text-dim);
      border: 1px solid var(--surface-3);
    }

    .empty-state {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .refresh-info {
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 2rem;
    }

    .error-banner {
      background: var(--red-soft);
      border: 1px solid var(--red-soft);
      color: var(--red);
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 0.8rem;
      margin-bottom: 1.5rem;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div>
        <div class="logo-text">candy network</div>
        <div class="logo-sub">distributed service discovery</div>
      </div>
    </div>
    <div class="status-dot" id="statusDot"></div>
  </header>

  <main>
    <div class="error-banner" id="errorBanner"></div>

    <div class="section">
      <div class="section-header">
        <div class="section-title">Local Records</div>
        <div class="section-count" id="localCount">0</div>
      </div>
      <div class="record-list" id="localRecords">
        <div class="empty-state">loading...</div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <div class="section-title">Remote Records</div>
        <div class="section-count" id="remoteCount">0</div>
      </div>
      <div class="record-list" id="remoteRecords">
        <div class="empty-state">loading...</div>
      </div>
    </div>

    <div class="refresh-info">auto-refreshes every 30s</div>
  </main>

  <script>
    const token = window.CANDY_TOKEN
    let refreshTimer = null

    const escapeHtml = (value) => String(value)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;')

    const formatExpiry = (ms) => {
      if (ms <= 0) return 'expired'
      const mins = Math.floor(ms / 60000)
      const secs = Math.floor((ms % 60000) / 1000)
      if (mins > 0) return `${mins}m ${secs}s`
      return `${secs}s`
    }

    const normalizeLocalEntries = (local) => {
      if (Array.isArray(local)) return local
      return Object.entries(local || {}).map(([name, ip]) => ({
        name,
        ip,
        canonicalFqdn: `${name}.candy`,
        aliasFqdns: [],
        winner: true,
      }))
    }

    const normalizeRemoteEntries = (remote) => {
      if (Array.isArray(remote)) return remote
      return Object.entries(remote || {}).map(([name, info]) => ({
        name,
        ip: info.ip,
        expiresIn: info.expiresIn,
        canonicalFqdn: `${name}.candy`,
        aliasFqdns: [],
        winner: true,
      }))
    }

    const renderDomains = (entry) => {
      const rows = []
      if (entry.canonicalFqdn) {
        rows.push(`<div class="record-domain"><strong>canonical</strong> ${escapeHtml(entry.canonicalFqdn)}</div>`)
      }
      for (const alias of entry.aliasFqdns || []) {
        rows.push(`<div class="record-domain"><strong>alias</strong> ${escapeHtml(alias)}</div>`)
      }
      if (rows.length === 0) {
        rows.push('<div class="record-domain"><strong>routing</strong> shadowed by an earlier exact claim</div>')
      }
      return rows.join('')
    }

    const renderHost = (entry) => {
      const parts = []
      if (entry.hostLabel) parts.push(entry.hostLabel)
      else if (entry.hostName) parts.push(entry.hostName)
      if (entry.dnsName) parts.push(entry.dnsName)
      if (parts.length === 0) return ''
      return `<div class="record-host"><strong>host</strong> ${escapeHtml(parts.join(' · '))}</div>`
    }

    const renderOwnershipTag = (entry, local) => {
      if (local) return '<span class="tag tag-canonical">canonical</span>'
      if (entry.winner) return '<span class="tag tag-canonical">canonical</span>'
      if ((entry.aliasFqdns || []).length > 0) return '<span class="tag tag-alias">alias</span>'
      return '<span class="tag tag-shadowed">shadowed</span>'
    }

    const renderRecords = (data) => {
      const localEl = document.getElementById('localRecords')
      const remoteEl = document.getElementById('remoteRecords')
      const localCountEl = document.getElementById('localCount')
      const remoteCountEl = document.getElementById('remoteCount')

      // Local records
      const localEntries = normalizeLocalEntries(data.local)
      localCountEl.textContent = localEntries.length
      if (localEntries.length === 0) {
        localEl.innerHTML = '<div class="empty-state">no local routes</div>'
      } else {
        localEl.innerHTML = localEntries.map((entry) => `
          <div class="record">
            <div>
              <div class="record-name">${escapeHtml(entry.name)}<span class="tld">.candy</span></div>
              <div class="record-details">
                ${renderDomains(entry)}
                ${renderHost(entry)}
              </div>
            </div>
            <div class="record-meta">
              <span class="record-ip">${escapeHtml(entry.ip)}</span>
              ${renderOwnershipTag(entry, true)}
              <span class="tag tag-local">local</span>
            </div>
          </div>
        `).join('')
      }

      // Remote records
      const remoteEntries = normalizeRemoteEntries(data.remote)
      remoteCountEl.textContent = remoteEntries.length
      if (remoteEntries.length === 0) {
        remoteEl.innerHTML = '<div class="empty-state">no remote records</div>'
      } else {
        remoteEl.innerHTML = remoteEntries.map((entry) => `
          <div class="record">
            <div>
              <div class="record-name">${escapeHtml(entry.name)}<span class="tld">.candy</span></div>
              <div class="record-details">
                ${renderDomains(entry)}
                ${renderHost(entry)}
              </div>
            </div>
            <div class="record-meta">
              <span class="record-expiry">expires in ${formatExpiry(entry.expiresIn || 0)}</span>
              <span class="record-ip">${escapeHtml(entry.ip)}</span>
              ${renderOwnershipTag(entry, false)}
              <span class="tag tag-remote">remote</span>
            </div>
          </div>
        `).join('')
      }
    }

    const fetchRegistry = async () => {
      const errorBanner = document.getElementById('errorBanner')
      const statusDot = document.getElementById('statusDot')
      try {
        const res = await fetch('/candy/registry')
        if (!res.ok) throw new Error(`${res.status} ${res.statusText}`)
        const data = await res.json()
        renderRecords(data)
        errorBanner.style.display = 'none'
        statusDot.style.background = 'var(--green)'
        statusDot.style.boxShadow = '0 0 8px var(--green)'
      } catch (e) {
        errorBanner.textContent = `Failed to fetch registry: ${e.message}`
        errorBanner.style.display = 'block'
        statusDot.style.background = 'var(--red)'
        statusDot.style.boxShadow = '0 0 8px var(--red)'
      }
    }

    fetchRegistry()
    refreshTimer = setInterval(fetchRegistry, 30000)
  </script>
</body>
</html>
