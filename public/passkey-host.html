<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passkey · candy</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M8 32 18 25v14zM56 32 46 25v14z' fill='%23c86bff'/%3E%3Ccircle cx='32' cy='32' r='15' fill='%23d42a47'/%3E%3C/svg%3E">
  <!-- Served only on candy's own host (candy-host.ts), with a nonce'd CSP:
       no external resources, no inline style attributes. -->
  <style>
    :root {
      color-scheme: light;
      --bg: #eceef2;
      --sheet: #ffffff;
      --sheet-2: #f5f6f9;
      --ink: #1a1d33;
      --ink-2: #555b75;
      --ink-3: #8a90a8;
      --line: #e1e4eb;
      --line-2: #c9cdd9;
      --cherry: #d42a47;
      --cherry-hover: #bb1f3b;
      --cherry-ink: #ffffff;
      --lemon: #c18a06;
      --green: #0b9468;
      --font-ui: system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-host: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #10121a;
        --sheet: #171a25;
        --sheet-2: #1d2130;
        --ink: #e7e9f2;
        --ink-2: #a3a8c0;
        --ink-3: #6c7290;
        --line: #252938;
        --line-2: #353a4c;
        --cherry: #ff5d78;
        --cherry-hover: #ff7a90;
        --cherry-ink: #2a0710;
        --lemon: #f2c14e;
        --green: #3fd3a1;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font: 14px/1.45 var(--font-ui);
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--cherry); outline-offset: 2px; border-radius: 6px; }
    main { width: 100%; max-width: 380px; }
    .wordmark {
      display: block;
      margin-bottom: 18px;
      font-family: var(--font-host);
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -0.04em;
      color: var(--ink);
    }
    .wordmark span { color: var(--cherry); }
    .sheet {
      background: var(--sheet);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 1px 2px rgba(10, 12, 24, 0.04);
    }
    h1 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
    .lede { color: var(--ink-2); font-size: 13px; margin-bottom: 16px; overflow-wrap: anywhere; }
    .host { font-family: var(--font-host); font-size: 12px; color: var(--ink); }
    .btn {
      display: block;
      width: 100%;
      height: 38px;
      border: 1px solid var(--cherry);
      border-radius: 8px;
      background: var(--cherry);
      color: var(--cherry-ink);
      font: 600 14px var(--font-ui);
      cursor: pointer;
    }
    .btn:hover { background: var(--cherry-hover); border-color: var(--cherry-hover); }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn.secondary { background: var(--sheet-2); border-color: var(--line-2); color: var(--ink); margin-top: 10px; }
    .msg { min-height: 20px; margin-top: 12px; font-size: 13px; color: var(--cherry); }
    .msg.wait { color: var(--lemon); }
    .msg.ok { color: var(--green); }
    .links { margin-top: 14px; font-size: 13px; text-align: center; }
    .links a { color: var(--ink-2); }
    .links a:hover { color: var(--ink); }
    .foot { margin-top: 14px; color: var(--ink-3); font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <div class="wordmark" aria-label="candy">candy<span>.</span></div>
    <div class="sheet">
      <h1 id="title">Passkey</h1>
      <p class="lede" id="lede"></p>
      <button class="btn" id="go" type="button" hidden>Continue</button>
      <button class="btn secondary" id="close" type="button" hidden>Close this window</button>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
      <div class="links" id="links"></div>
    </div>
    <p class="foot" id="foot"></p>
  </main>

  <script>
    (function () {
      var V = window.CANDY_PASSKEY || {};
      // The stamp came in the URL once: keep it in memory, take it out of the address bar and history
      var stamp = null;
      try { stamp = new URLSearchParams(location.search).get('candy_stamp'); } catch (e) {}
      try { history.replaceState(null, '', location.pathname); } catch (e) {}

      var $ = function (id) { return document.getElementById(id); };
      var title = $('title'), lede = $('lede'), go = $('go'), closeBtn = $('close'), msg = $('msg'), links = $('links');
      var enroll = V.purpose === 'enroll';
      var portal = String(V.portal || '');
      var next = String(V.next || '/');
      var busy = false;

      var say = function (text, cls) { msg.className = 'msg' + (cls ? ' ' + cls : ''); msg.textContent = text || ''; };
      var link = function (href, text) {
        var a = document.createElement('a');
        a.href = href;
        a.textContent = text;
        links.replaceChildren(a);
      };
      var portalUrl = function (path) { return portal + path; };
      var loginAgain = function () { return portalUrl('/auth/passkey/start?next=' + encodeURIComponent(next)); };
      // Re-authenticating for an app (max_age): the password instead is on the consent page itself
      var withPassword = function () {
        return V.fresh ? portalUrl(next + (next.indexOf('?') < 0 ? '?' : '&') + 'with=password') : portalUrl('/login?next=' + encodeURIComponent(next) + '&with=password');
      };
      var backToPasskeys = function () { return portalUrl('/passkeys'); };

      $('foot').textContent = 'candy checks passkeys on ' + location.host + ', then sends you back to ' + (portal.replace(/^https:\/\//, '') || 'the portal') + '.';

      if (enroll) {
        title.textContent = 'Add a passkey';
        lede.textContent = '';
        lede.append('For ', Object.assign(document.createElement('b'), { textContent: String(V.user || '') }), ' on candy');
        if (V.name) lede.append(', named “', String(V.name), '”');
        lede.append('. Your browser will ask you to make it.');
        link(backToPasskeys(), 'Back to the passkeys page');
      } else if (V.fresh) {
        title.textContent = 'Confirm it’s you';
        lede.textContent = 'A site you’re signing in to asks you to authenticate again. Your browser will ask for your passkey for candy.';
        link(withPassword(), 'Use your password instead');
      } else {
        title.textContent = 'Log in with a passkey';
        lede.textContent = 'Your browser will ask for your passkey for candy.';
        link(withPassword(), 'Use your password instead');
      }

      // ---- states ----
      if (V.state === 'expired' || V.state === 'elsewhere' || V.state === 'busy' || !stamp) {
        title.textContent = V.state === 'elsewhere' ? 'This link was opened somewhere else' : V.state === 'busy' ? 'Too many passkey attempts' : 'This link expired';
        lede.textContent = V.state === 'elsewhere'
          ? 'Passkey links work once, in the browser that opened them first.'
          : V.state === 'busy' ? 'candy is refusing new passkey attempts from here for a few minutes.' : 'Passkey links work once, for a few minutes.';
        link(enroll ? backToPasskeys() : V.fresh ? portalUrl(next) : portalUrl('/login?next=' + encodeURIComponent(next)), 'Go back and try again');
        return;
      }
      if (!window.PublicKeyCredential || !navigator.credentials) {
        say('This browser can’t use passkeys.');
        if (enroll) closeBtn.hidden = false;
        return;
      }

      // ---- base64url <-> ArrayBuffer, for browsers without the JSON helpers ----
      var b64urlToBuf = function (s) {
        s = String(s).replace(/-/g, '+').replace(/_/g, '/');
        while (s.length % 4) s += '=';
        var bin = atob(s), out = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out.buffer;
      };
      var bufToB64url = function (buf) {
        var bytes = new Uint8Array(buf), bin = '';
        for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      };
      var creationOptions = function (json) {
        if (typeof PublicKeyCredential.parseCreationOptionsFromJSON === 'function') {
          try { return PublicKeyCredential.parseCreationOptionsFromJSON(json); } catch (e) {}
        }
        return Object.assign({}, json, {
          challenge: b64urlToBuf(json.challenge),
          user: Object.assign({}, json.user, { id: b64urlToBuf(json.user.id) }),
          excludeCredentials: (json.excludeCredentials || []).map(function (c) { return Object.assign({}, c, { id: b64urlToBuf(c.id) }); }),
        });
      };
      var requestOptions = function (json) {
        if (typeof PublicKeyCredential.parseRequestOptionsFromJSON === 'function') {
          try { return PublicKeyCredential.parseRequestOptionsFromJSON(json); } catch (e) {}
        }
        return Object.assign({}, json, {
          challenge: b64urlToBuf(json.challenge),
          allowCredentials: (json.allowCredentials || []).map(function (c) { return Object.assign({}, c, { id: b64urlToBuf(c.id) }); }),
        });
      };
      var extras = function (cred) {
        return {
          authenticatorAttachment: cred.authenticatorAttachment || null,
          clientExtensionResults: typeof cred.getClientExtensionResults === 'function' ? cred.getClientExtensionResults() : {},
        };
      };
      var credentialJSON = function (cred) {
        if (typeof cred.toJSON === 'function') {
          try { return cred.toJSON(); } catch (e) {}
        }
        var r = cred.response;
        var response = enroll
          ? { clientDataJSON: bufToB64url(r.clientDataJSON), attestationObject: bufToB64url(r.attestationObject), transports: typeof r.getTransports === 'function' ? r.getTransports() : [] }
          : { clientDataJSON: bufToB64url(r.clientDataJSON), authenticatorData: bufToB64url(r.authenticatorData), signature: bufToB64url(r.signature), userHandle: r.userHandle ? bufToB64url(r.userHandle) : null };
        return Object.assign({ id: cred.id, rawId: bufToB64url(cred.rawId), type: cred.type, response: response }, extras(cred));
      };

      var base = enroll ? '/passkey/enroll' : '/passkey/login';
      var post = function (path, body) {
        return fetch(path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(Object.assign({ stamp: stamp }, body || {})),
          credentials: 'same-origin',
        }).then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (data) { return { res: res, data: data }; });
        });
      };

      // The stamp is used up (verify ran, or it expired): only a fresh start helps
      var spent = function (text) {
        stamp = null;
        go.hidden = true;
        say(text);
        if (enroll) {
          closeBtn.hidden = false;
          link(backToPasskeys(), 'Back to the passkeys page');
        } else {
          go.hidden = false;
          go.disabled = false;
          go.textContent = 'Try again';
          go.onclick = function () { location.href = V.fresh ? portalUrl(next) : loginAgain(); };
          link(withPassword(), 'Use your password instead');
        }
      };
      // The prompt was closed or failed before anything was sent: the same stamp can try again
      var retry = function (text) {
        busy = false;
        go.hidden = false;
        go.disabled = false;
        go.textContent = 'Try again';
        say(text);
      };

      var done = function () {
        title.textContent = 'Passkey added';
        go.hidden = true;
        say('You can log in with it now.', 'ok');
        var told = false;
        try {
          // Only the portal page that opened this window hears it (exact origin)
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage({ type: 'candy-passkey', purpose: 'enroll', ok: true }, portal);
            told = true;
          }
        } catch (e) {}
        if (told) { setTimeout(function () { window.close(); }, 600); }
        // Still open (no opener, or the browser keeps it): say so
        setTimeout(function () {
          say('Done, you can close this window.', 'ok');
          closeBtn.hidden = false;
          link(backToPasskeys(), 'Back to the passkeys page');
        }, told ? 1200 : 0);
      };

      var signIn = function (post) {
        // A form POST to the portal that started this: the code never goes into a URL
        var action;
        try { action = new URL(post.action); } catch (e) { return spent('Something went wrong. Go back and try again.'); }
        if (action.origin !== portal || action.pathname !== '/auth/passkey/finish') return spent('Something went wrong. Go back and try again.');
        var form = document.createElement('form');
        form.method = 'POST';
        form.action = action.href;
        Object.keys(post.fields || {}).forEach(function (k) {
          var input = document.createElement('input');
          input.type = 'hidden';
          input.name = k;
          input.value = String(post.fields[k]);
          form.appendChild(input);
        });
        document.body.appendChild(form);
        say('Logging you in…', 'wait');
        form.submit();
      };

      var lockout = function (seconds) {
        var until = Date.now() + seconds * 1000;
        go.hidden = false;
        go.disabled = true;
        var tick = function () {
          var left = Math.max(0, Math.ceil((until - Date.now()) / 1000));
          if (!left) { clearInterval(timer); go.disabled = false; go.textContent = 'Try again'; say(''); busy = false; return; }
          say('Too many failed logins. Try again in ' + left + 's.', 'wait');
        };
        var timer = setInterval(tick, 1000);
        tick();
      };

      var run = function () {
        if (busy || !stamp) return;
        busy = true;
        go.disabled = true;
        say('Getting ready…', 'wait');
        post(base + '/options').then(function (o) {
          if (o.res.status === 429 && o.data.retryAfter) return lockout(o.data.retryAfter);
          if (o.res.status === 404) return spent(o.data.error || 'This link expired. Go back and try again.');
          if (!o.res.ok) return spent(o.data.error || 'Something went wrong. Go back and try again.');
          say('Follow your browser’s prompt…', 'wait');
          var ask = enroll
            ? navigator.credentials.create({ publicKey: creationOptions(o.data.publicKey) })
            : navigator.credentials.get({ publicKey: requestOptions(o.data.publicKey), mediation: 'optional' });
          return ask.then(function (cred) {
            if (!cred) return retry('The passkey prompt closed.');
            say('Checking…', 'wait');
            return post(base + '/verify', { challengeId: o.data.challengeId, credential: credentialJSON(cred) }).then(function (v) {
              if (v.res.ok) return enroll ? done() : signIn(v.data);
              if (v.res.status === 429 && v.data.retryAfter) return spent('Too many failed logins. Try again in ' + v.data.retryAfter + 's.');
              return spent(v.data.error || 'That didn’t work.');
            });
          }, function (e) {
            var name = e && e.name;
            // Cancelled, timed out, or no user gesture yet (Safari): nothing was sent, try again
            if (name === 'NotAllowedError' || name === 'AbortError') return retry('The passkey prompt closed. Try again when you’re ready.');
            if (name === 'InvalidStateError' && enroll) return retry('This device already has a passkey for you on candy.');
            return retry('Your browser couldn’t use a passkey' + (e && e.message ? ': ' + e.message : '.'));
          });
        }).catch(function () {
          retry('Could not reach candy. Try again.');
        });
      };

      go.hidden = false;
      go.textContent = enroll ? 'Make a passkey' : 'Use my passkey';
      go.addEventListener('click', run);
      closeBtn.addEventListener('click', function () { window.close(); });
      run();
    })();
  </script>
</body>
</html>
