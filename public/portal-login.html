<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="same-origin">
  <title>Log in · candy</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,400..700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #eceef2;
      --sheet: #ffffff;
      --sheet-2: #f5f6f9;
      --ink: #1a1d33;
      --ink-2: #555b75;
      --ink-3: #8a90a8;
      --line: #e1e4eb;
      --line-2: #c9cdd9;
      --cherry: #d42a47;
      --cherry-hover: #bb1f3b;
      --cherry-ink: #ffffff;
      --cherry-soft: rgba(212, 42, 71, 0.09);
      --lemon: #c18a06;
      --lemon-soft: rgba(232, 177, 11, 0.2);
      --font-ui: 'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-host: 'Martian Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #10121a;
        --sheet: #171a25;
        --sheet-2: #1d2130;
        --ink: #e7e9f2;
        --ink-2: #a3a8c0;
        --ink-3: #6c7290;
        --line: #252938;
        --line-2: #353a4c;
        --cherry: #ff5d78;
        --cherry-hover: #ff7a90;
        --cherry-ink: #2a0710;
        --cherry-soft: rgba(255, 93, 120, 0.12);
        --lemon: #f2c14e;
        --lemon-soft: rgba(242, 193, 78, 0.2);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font: 14px/1.45 var(--font-ui);
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    :focus-visible { outline: 2px solid var(--cherry); outline-offset: 2px; border-radius: 6px; }

    main { width: 100%; max-width: 360px; }
    .wordmark {
      display: block;
      margin-bottom: 18px;
      font-family: var(--font-host);
      font-weight: 700;
      font-size: 22px;
      font-stretch: 112.5%;
      letter-spacing: -0.04em;
      color: var(--ink);
      text-decoration: none;
    }
    .wordmark span { color: var(--cherry); }
    .sheet {
      background: var(--sheet);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 1px 2px rgba(10, 12, 24, 0.04);
    }
    h1 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
    .lede { color: var(--ink-2); font-size: 13px; margin-bottom: 18px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
    .field { margin-bottom: 14px; }
    select, input {
      width: 100%;
      height: 38px;
      padding: 0 11px;
      border: 1px solid var(--line-2);
      border-radius: 8px;
      background: var(--sheet-2);
      color: var(--ink);
      font: 14px var(--font-ui);
    }
    select { font-family: var(--font-host); font-stretch: 87.5%; }
    select:focus, input:focus { outline: none; border-color: var(--cherry); }
    .btn {
      width: 100%;
      height: 38px;
      border: 1px solid var(--cherry);
      border-radius: 8px;
      background: var(--cherry);
      color: var(--cherry-ink);
      font: 600 14px var(--font-ui);
      cursor: pointer;
    }
    .btn:hover { background: var(--cherry-hover); border-color: var(--cherry-hover); }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .msg { min-height: 20px; margin-top: 12px; font-size: 13px; color: var(--cherry); }
    .msg.wait { color: var(--lemon); }
    .note {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--lemon-soft);
      color: var(--ink);
      font-size: 13px;
    }
    .note code { font-family: var(--font-host); font-size: 12px; }
    .foot { margin-top: 14px; color: var(--ink-3); font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <a class="wordmark" href="/" aria-label="candy">candy<span>.</span></a>
    <div class="sheet">
      <h1>Log in</h1>
      <p class="lede">With your account on this machine. You see and manage your own sites.</p>
      <form id="form" autocomplete="on">
        <div class="field">
          <label for="user">Account</label>
          <select id="user" name="username" autocomplete="username" required></select>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn" id="submit" type="submit">Log in</button>
        <div class="msg" id="msg" role="status" aria-live="polite"></div>
      </form>
      <div class="note" id="unavailable" hidden>
        Login isn't set up on this machine: <code>/etc/pam.d/candy</code> is missing. Run <code>install-service.sh</code> as root to install it.
      </div>
    </div>
    <p class="foot">Superusers (sudoers) see every user's sites and the daemon's settings.</p>
  </main>

  <script>
    const vars = window.CANDY_VARS || {};
    const next = typeof vars.next === 'string' && vars.next.startsWith('/') && !vars.next.startsWith('//') ? vars.next : '/';
    const form = document.getElementById('form');
    const userEl = document.getElementById('user');
    const passEl = document.getElementById('password');
    const submit = document.getElementById('submit');
    const msg = document.getElementById('msg');
    let lockTimer = null;

    function setUnavailable() {
      document.getElementById('unavailable').hidden = false;
      submit.disabled = true;
      passEl.disabled = true;
    }

    // A lockout for this address: count down, then let them try again
    function lockFor(seconds) {
      clearInterval(lockTimer);
      const until = Date.now() + seconds * 1000;
      submit.disabled = true;
      const tick = () => {
        const left = Math.max(0, Math.ceil((until - Date.now()) / 1000));
        if (left === 0) {
          clearInterval(lockTimer);
          submit.disabled = false;
          msg.className = 'msg';
          msg.textContent = '';
          return;
        }
        const h = Math.floor(left / 3600), m = Math.floor((left % 3600) / 60), s = left % 60;
        const text = h ? `${h}h ${String(m).padStart(2, '0')}m` : m ? `${m}m ${String(s).padStart(2, '0')}s` : `${s}s`;
        msg.className = 'msg wait';
        msg.textContent = `Too many failed logins from here. Try again in ${text}.`;
      };
      tick();
      lockTimer = setInterval(tick, 1000);
    }

    async function loadUsers() {
      if (vars.available === false) setUnavailable();
      try {
        const res = await fetch('/auth/users', { headers: { Accept: 'application/json' } });
        const data = await res.json();
        if (data.available === false) setUnavailable();
        userEl.replaceChildren(...(data.users || []).map(name => {
          const o = document.createElement('option');
          o.value = name;
          o.textContent = name;
          return o;
        }));
        if (!userEl.options.length) {
          msg.textContent = 'No accounts can log in here.';
          submit.disabled = true;
        }
      } catch {
        msg.textContent = 'Could not reach the candy daemon.';
      }
      if (!submit.disabled) passEl.focus();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (submit.disabled) return;
      submit.disabled = true;
      msg.className = 'msg';
      msg.textContent = 'Checking…';
      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify({ user: userEl.value, password: passEl.value }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          // The login's second half: the cookie also reaches other ports on this
          // host, this storage doesn't. Every portal request sends it back.
          try { localStorage.setItem('candy_session', data.session || ''); } catch {}
          if (!data.session) { msg.textContent = 'This browser blocks storage, which the portal needs to stay logged in.'; submit.disabled = false; return; }
          msg.textContent = '';
          location.replace(next);
          return;
        }
        passEl.value = '';
        if (res.status === 503) {
          msg.textContent = '';
          setUnavailable();
          return;
        }
        if (data.retryAfter) {
          lockFor(data.retryAfter);
          return;
        }
        msg.textContent = data.error || 'Login failed.';
        submit.disabled = false;
        passEl.focus();
      } catch {
        msg.textContent = 'Could not reach the candy daemon.';
        submit.disabled = false;
      }
    });

    loadUsers();
  </script>
</body>
</html>
