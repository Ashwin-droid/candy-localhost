<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening Portal...</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,400..700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #eceef2;
      --surface: #ffffff;
      --surface-2: #f5f6f9;
      --surface-3: #efeff3;
      --border: #e1e4eb;
      --border-bright: #c9cdd9;
      --text: #1a1d33;
      --text-dim: #555b75;
      --text-muted: #8a90a8;
      --accent: #d42a47;
      --accent-hover: #bb1f3b;
      --accent-soft: rgba(212, 42, 71, 0.09);
      --accent-ink: #ffffff;
      --violet: #6d4ae0;
      --green: #0b9468;
      --green-soft: rgba(11, 148, 104, 0.12);
      --red: #d42a47;
      --red-soft: rgba(212, 42, 71, 0.08);
      --yellow: #b7791f;
      --yellow-soft: rgba(183, 121, 31, 0.1);
      --blue: #3b6fd8;
      --blue-soft: rgba(59, 111, 216, 0.1);
      --shadow: 0 1px 2px rgba(26, 29, 51, 0.05);
      --log-bg: #0e0e12;
      --log-text: #e4e4ea;
      /* legacy names used by this page's rules */
      --bg-deep: var(--bg); --bg-surface: var(--surface); --bg-card: var(--surface); --bg-elevated: var(--surface-2);
      --dim: var(--text-dim);
      --cyan: var(--accent); --cyan-dim: var(--accent-hover); --cyan-glow: var(--accent-soft);
      --magenta: var(--accent); --magenta-dim: var(--accent-hover); --magenta-glow: var(--accent-soft);
      --green-dim: var(--green); --red-dim: var(--red); --red-glow: var(--red-soft);
      --font-sans: 'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-mono: 'Martian Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #10121a;
        --surface: #171a25;
        --surface-2: #1d2130;
        --surface-3: #25252b;
        --border: #252938;
        --border-bright: #353a4c;
        --text: #e7e9f2;
        --text-dim: #a3a8c0;
        --text-muted: #6c7290;
        --accent: #ff5d78;
        --accent-hover: #ff7a90;
        --accent-soft: rgba(255, 93, 120, 0.12);
        --accent-ink: #2a0710;
        --violet: #a893ff;
        --green: #3fd3a1;
        --green-soft: rgba(63, 211, 161, 0.14);
        --red: #ff5d78;
        --red-soft: rgba(255, 93, 120, 0.12);
        --yellow: #f2b84b;
        --yellow-soft: rgba(242, 184, 75, 0.12);
        --blue: #74a0ff;
        --blue-soft: rgba(116, 160, 255, 0.12);
        --shadow: none;
        --log-bg: #0b0b0e;
        --log-text: #e4e4ea;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      max-width: 600px;
      width: 100%;
    }

    .terminal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .terminal-header {
      background: var(--surface);
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .terminal-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--dim);
    }
    .terminal-dot.red { background: #ff5f57; }
    .terminal-dot.yellow { background: #febc2e; }
    .terminal-dot.green { background: #28c840; }

    .terminal-title {
      flex: 1;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }

    .terminal-body {
      padding: 1.5rem;
      min-height: 200px;
    }

    .log-line {
      margin-bottom: 0.5rem;
      font-size: 0.8rem;
      line-height: 1.6;
    }

    .log-line .time {
      color: var(--dim);
    }

    .log-line .action {
      color: var(--cyan);
    }

    .log-line .success {
      color: var(--green);
    }

    .log-line .url {
      color: var(--magenta);
      word-break: break-all;
    }

    .spinner {
      display: inline-block;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .countdown {
      margin-top: 1.5rem;
      padding: 1rem;
      background: var(--bg);
      border-radius: 6px;
      text-align: center;
    }

    .countdown-number {
      font-size: 2rem;
      font-weight: 700;
      color: var(--cyan);
    }

    .countdown-label {
      font-size: 0.7rem;
      color: var(--dim);
      margin-top: 0.25rem;
    }

    .progress-bar {
      margin-top: 1rem;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 1s linear;
    }

    .actions {
      margin-top: 1rem;
      display: flex;
      gap: 0.75rem;
      justify-content: center;
    }

    .btn {
      padding: 0.6rem 1.2rem;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn:hover {
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .btn-primary {
      background: var(--cyan);
      color: var(--bg);
      border-color: var(--cyan);
    }

    .btn-primary:hover {
      background: transparent;
      color: var(--cyan);
    }

    .hidden { display: none; }
      code, .mono, [class*="domain"], pre { font-stretch: 87.5%; }
  
    /* hostnames read as hostnames: one face, no single-word highlight */
    h1 .domain, h1 .domain-name { color: var(--text); font-family: var(--font-mono); font-stretch: 87.5%; font-weight: 600; letter-spacing: -0.02em; }
    h1 .tld-suffix { color: var(--text-muted); font-family: var(--font-mono); font-stretch: 87.5%; font-weight: 400; letter-spacing: -0.02em; }
    .panel-badge { text-transform: none !important; letter-spacing: 0 !important; }
  </style>
</head>
<body>
  <div class="container">
    <div class="terminal">
      <div class="terminal-header">
        <div class="terminal-title" id="serverName">Opening a portal</div><!-- updated by JS -->
      </div>
      <div class="terminal-body">
        <div id="logs">
          <div class="log-line">
            <span class="time">[00:00]</span>
            <span class="action">Opening portal...</span>
            <span class="spinner">|</span>
          </div>
        </div>

        <div id="countdown-section" class="countdown hidden">
          <div class="countdown-number" id="countdown">20</div>
          <div class="countdown-label">seconds until redirect (DNS propagation)</div>
          <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
          </div>
        </div>

        <div id="actions" class="actions hidden">
          <a href="#" id="go-now" class="btn btn-primary">Go Now</a>
          <a href="#" class="btn" id="portalLink">Back to portal</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = '';
    const _host = location.hostname;
    const _isBoundDomain = !_host.endsWith('.candy') && !_host.endsWith('.localhost');
    const TLD = _host.endsWith('.candy') ? 'candy' : _host.endsWith('.localhost') ? 'localhost' : null;
    const SCHEME = 'https';
    const vars = window.CANDY_VARS || {};
    const serverName = vars.name || 'unknown';
    const existingUrl = vars.existingUrl || '';
    const REDIRECT_DELAY = 20; // seconds

    document.getElementById('serverName').textContent = `Opening a portal for ${_host}`;
    document.getElementById('portalLink').href = `${SCHEME}://portal.${_isBoundDomain ? 'localhost' : TLD}`;

    const logsEl = document.getElementById('logs');
    const countdownSection = document.getElementById('countdown-section');
    const countdownEl = document.getElementById('countdown');
    const progressEl = document.getElementById('progress');
    const actionsEl = document.getElementById('actions');
    const goNowBtn = document.getElementById('go-now');

    let startTime = Date.now();
    let tunnelUrl = existingUrl;
    let urlReceivedAt = existingUrl ? Date.now() : null;
    let redirecting = false;

    function formatTime() {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const secs = String(elapsed % 60).padStart(2, '0');
      return `${mins}:${secs}`;
    }

    function addLog(action, extra = '', className = 'action') {
      const line = document.createElement('div');
      line.className = 'log-line';
      line.innerHTML = `<span class="time">[${formatTime()}]</span> <span class="${className}">${action}</span>${extra ? ' ' + extra : ''}`;
      logsEl.appendChild(line);
    }

    function updateSpinner() {
      const frames = ['|', '/', '-', '\\'];
      const spinners = document.querySelectorAll('.spinner');
      const frame = frames[Math.floor(Date.now() / 100) % frames.length];
      spinners.forEach(s => s.textContent = frame);
    }

    async function checkStatus() {
      try {
        const res = await fetch(`${API}/portal/status/${serverName}`);
        const data = await res.json();

        if (data.ready && data.url && !tunnelUrl) {
          tunnelUrl = data.url;
          urlReceivedAt = Date.now();

          // Update logs
          logsEl.innerHTML = '';
          addLog('Portal created', '', 'success');
          addLog('Tunnel URL:', `<span class="url">${tunnelUrl}</span>`);
          addLog('Waiting for DNS propagation...', '<span class="spinner">|</span>');

          // Show countdown
          countdownSection.classList.remove('hidden');
          actionsEl.classList.remove('hidden');
          goNowBtn.href = tunnelUrl;

          startCountdown();
        }
      } catch (e) {
        console.error('Status check failed:', e);
      }
    }

    function startCountdown() {
      let remaining = REDIRECT_DELAY;

      const tick = () => {
        if (redirecting) return;

        const elapsed = Math.floor((Date.now() - urlReceivedAt) / 1000);
        remaining = Math.max(0, REDIRECT_DELAY - elapsed);

        countdownEl.textContent = remaining;
        progressEl.style.width = `${((REDIRECT_DELAY - remaining) / REDIRECT_DELAY) * 100}%`;

        if (remaining <= 0) {
          redirecting = true;
          addLog('Redirecting...', '', 'success');
          window.location.href = tunnelUrl;
        } else {
          setTimeout(tick, 1000);
        }
      };

      tick();
    }

    // If URL already exists, start countdown immediately
    if (existingUrl) {
      logsEl.innerHTML = '';
      addLog('Portal already open', '', 'success');
      addLog('Tunnel URL:', `<span class="url">${existingUrl}</span>`);
      addLog('Redirecting shortly...', '<span class="spinner">|</span>');

      countdownSection.classList.remove('hidden');
      actionsEl.classList.remove('hidden');
      goNowBtn.href = existingUrl;

      startCountdown();
    } else {
      // Poll for status
      setInterval(checkStatus, 1000);
    }

    // Update spinners
    setInterval(updateSpinner, 100);
  </script>
</body>
</html>
