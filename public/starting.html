<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starting Server...</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,400..700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #eceef2;
      --surface: #ffffff;
      --surface-2: #f5f6f9;
      --surface-3: #efeff3;
      --border: #e1e4eb;
      --border-bright: #c9cdd9;
      --text: #1a1d33;
      --text-dim: #555b75;
      --text-muted: #8a90a8;
      --accent: #d42a47;
      --accent-hover: #bb1f3b;
      --accent-soft: rgba(212, 42, 71, 0.09);
      --accent-ink: #ffffff;
      --violet: #6d4ae0;
      --green: #0b9468;
      --green-soft: rgba(11, 148, 104, 0.12);
      --red: #d42a47;
      --red-soft: rgba(212, 42, 71, 0.08);
      --yellow: #b7791f;
      --yellow-soft: rgba(183, 121, 31, 0.1);
      --blue: #3b6fd8;
      --blue-soft: rgba(59, 111, 216, 0.1);
      --shadow: 0 1px 2px rgba(26, 29, 51, 0.05);
      --log-bg: #0e0e12;
      --log-text: #e4e4ea;
      /* legacy names used by this page's rules */
      --bg-deep: var(--bg); --bg-surface: var(--surface); --bg-card: var(--surface); --bg-elevated: var(--surface-2);
      --dim: var(--text-dim);
      --cyan: var(--accent); --cyan-dim: var(--accent-hover); --cyan-glow: var(--accent-soft);
      --magenta: var(--accent); --magenta-dim: var(--accent-hover); --magenta-glow: var(--accent-soft);
      --green-dim: var(--green); --red-dim: var(--red); --red-glow: var(--red-soft);
      --font-sans: 'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-mono: 'Martian Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #10121a;
        --surface: #171a25;
        --surface-2: #1d2130;
        --surface-3: #25252b;
        --border: #252938;
        --border-bright: #353a4c;
        --text: #e7e9f2;
        --text-dim: #a3a8c0;
        --text-muted: #6c7290;
        --accent: #ff5d78;
        --accent-hover: #ff7a90;
        --accent-soft: rgba(255, 93, 120, 0.12);
        --accent-ink: #2a0710;
        --violet: #a893ff;
        --green: #3fd3a1;
        --green-soft: rgba(63, 211, 161, 0.14);
        --red: #ff5d78;
        --red-soft: rgba(255, 93, 120, 0.12);
        --yellow: #f2b84b;
        --yellow-soft: rgba(242, 184, 75, 0.12);
        --blue: #74a0ff;
        --blue-soft: rgba(116, 160, 255, 0.12);
        --shadow: none;
        --log-bg: #0b0b0e;
        --log-text: #e4e4ea;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      background: var(--bg-deep);
      color: var(--text);
      padding: 1.5rem;
      overflow-x: hidden;
    }


    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .spinner-container {
      width: 40px;
      height: 40px;
      position: relative;
    }

    .spinner {
      position: absolute;
      inset: 0;
      border: 3px solid var(--border);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .spinner-inner {
      position: absolute;
      inset: 6px;
      border: 2px solid var(--border);
      border-top-color: var(--magenta);
      border-radius: 50%;
      animation: spin 0.6s linear infinite reverse;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-family: var(--font-sans);
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text);
    }

    .domain {
      color: var(--cyan);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .status-pill.detecting {
      border-color: var(--yellow);
      color: var(--yellow);
      background: var(--yellow-soft);
    }

    .status-pill.success {
      border-color: var(--green);
      color: var(--green);
      background: var(--green-soft);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 1.5rem;
      height: calc(100vh - 140px);
    }

    @media (max-width: 900px) {
      .main-grid {
        grid-template-columns: 1fr;
        height: auto;
      }
    }

    .logs-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 400px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.875rem 1rem;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
    }

    .panel-title {
      font-size: 0.75rem;
      letter-spacing: 0;
      color: var(--text-dim);
    }

    .panel-badge {
      font-size: 0.65rem;
      padding: 0.25rem 0.5rem;
      background: var(--bg-card);
      border-radius: 4px;
      color: var(--text-muted);
    }

    .logs-content {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      font-size: 0.8rem;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--text-dim);
    }

    .logs-content::-webkit-scrollbar {
      width: 6px;
    }

    .logs-content::-webkit-scrollbar-track {
      background: transparent;
    }

    .logs-content::-webkit-scrollbar-thumb {
      background: var(--border-bright);
      border-radius: 3px;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
    }

    .card-title {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 1rem;
    }

    .port-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .port-btn {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      padding: 0.625rem 1rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--cyan);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .port-btn:hover {
      background: var(--cyan);
      color: var(--bg-deep);
      border-color: var(--cyan);
      box-shadow: var(--shadow);
    }

    .no-ports {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-style: italic;
      padding: 0.5rem 0;
    }

    .input-group {
      display: flex;
      gap: 0.5rem;
    }

    .input-group input {
      flex: 1;
      background: var(--bg-deep);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text);
      outline: none;
      transition: all 0.2s ease;
    }

    .input-group input:focus {
      border-color: var(--cyan-dim);
      box-shadow: var(--shadow);
    }

    .input-group input::placeholder {
      color: var(--text-muted);
    }

    .input-group button {
      background: var(--accent);
      color: var(--accent-ink);
      border: none;
      border-radius: 8px;
      padding: 0 1.25rem;
      color: var(--bg-deep);
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .input-group button:hover {
      box-shadow: var(--shadow);
    }

    .actions-card {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-dim);
      font-family: var(--font-sans);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      border-color: var(--border-bright);
      color: var(--text);
    }

    .action-btn.kill {
      border-color: var(--red-soft);
      color: var(--red);
    }

    .action-btn.kill:hover {
      background: var(--red-soft);
      border-color: var(--red);
    }

    .action-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .redirect-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 14, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .redirect-overlay.visible {
      opacity: 1;
      visibility: visible;
    }

    .redirect-content {
      text-align: center;
    }

    .redirect-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      border: 3px solid var(--green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      animation: scaleIn 0.3s ease;
    }

    @keyframes scaleIn {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }

    .redirect-icon svg {
      width: 32px;
      height: 32px;
      stroke: var(--green);
      stroke-width: 3;
      fill: none;
    }

    .redirect-text {
      font-family: var(--font-sans);
      font-size: 1.25rem;
      color: var(--text);
    }

    .redirect-port {
      color: var(--green);
    }
      code, .mono, [class*="domain"], pre { font-stretch: 87.5%; }
  
    /* hostnames read as hostnames: one face, no single-word highlight */
    h1 .domain, h1 .domain-name { color: var(--text); font-family: var(--font-mono); font-stretch: 87.5%; font-weight: 600; letter-spacing: -0.02em; }
    h1 .tld-suffix { color: var(--text-muted); font-family: var(--font-mono); font-stretch: 87.5%; font-weight: 400; letter-spacing: -0.02em; }
    .panel-badge { text-transform: none !important; letter-spacing: 0 !important; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <h1 id="pageTitle">Starting <span class="domain" id="serverName">server</span><span class="tld-suffix" id="tldSuffix">.localhost</span></h1>
      </div>
      <div class="status-pill detecting" id="statusPill">
        <span class="status-dot"></span>
        <span id="statusText">Detecting port…</span>
      </div>
    </header>

    <div class="main-grid">
      <div class="logs-panel">
        <div class="panel-header">
          <span class="panel-title">Output</span>
          <div style="display: flex; gap: 0.5rem; align-items: center;">
            <span class="panel-badge">Live</span>
          </div>
        </div>
        <div style="font-size: 0.65rem; color: var(--text-muted); padding: 0.5rem 1rem; background: var(--bg-elevated); border-bottom: 1px solid var(--border);">Need to type into it? <a id="terminalLink" href="#" style="color: var(--cyan);">Open it on the portal</a>.</div>
        <div class="logs-content" id="logsContent"></div>
      </div>

      <div class="sidebar">
        <div class="card">
          <div class="card-title" id="selectionTitle">Port</div>
          <div class="port-grid" id="detectedPorts">
            <span class="no-ports">Watching the output for a port…</span>
          </div>
          <div class="input-group" id="manualPortGroup">
            <input type="number" id="manualPort" placeholder="Port number" min="1024" max="65535">
            <button onclick="setPort()">Connect</button>
          </div>
        </div>

        <div class="card actions-card" id="actionsCard">
          <button class="action-btn" onclick="location.reload()">
            Detect again
          </button>
          <button class="action-btn kill" id="killBtn">
            Stop server
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="redirect-overlay" id="redirectOverlay">
    <div class="redirect-content">
      <div class="redirect-icon">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <div class="redirect-text">Port <span class="redirect-port" id="detectedPort">3000</span> detected</div>
    </div>
  </div>

  <script>
    const API = '';
    // Detect TLD: .candy, .localhost, or bound domain (keep full hostname for redirects)
    const _host = location.hostname;
    const _isBoundDomain = !_host.endsWith('.candy') && !_host.endsWith('.localhost');
    const TLD = _host.endsWith('.candy') ? 'candy' : _host.endsWith('.localhost') ? 'localhost' : null;
    const SCHEME = 'https';
    const vars = window.CANDY_VARS || { mode: 'starting', name: 'unknown', detectedPorts: [], returnPath: '/', variants: [] };
    const mode = vars.mode || 'starting';
    const serverName = vars.name;
    const returnPath = vars.returnPath || '/';
    const escapedServerName = serverName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const candySuffix = TLD ? '.' + TLD : '';
    const getServiceHost = () => {
      if (_isBoundDomain || !TLD) return location.host;  // keeps a :port (ts.net HTTPS)
      const left = _host.endsWith(candySuffix) ? _host.slice(0, -candySuffix.length) : _host;
      const actionMatch = left.match(new RegExp(`^${escapedServerName}\\.(?:kill|k|portal|p)(?:\\.(.+))?$`));
      if (!actionMatch) return _host;
      return actionMatch[1] ? `${serverName}.${actionMatch[1]}${candySuffix}` : `${serverName}${candySuffix}`;
    };
    const getServiceUrl = (path = '') => `${SCHEME}://${getServiceHost()}${path}`;
    // Update TLD suffix display for bound domains
    if (_isBoundDomain) {
      const suffix = document.getElementById('tldSuffix');
      if (suffix) suffix.textContent = '';
      const nameEl = document.getElementById('serverName');
      if (nameEl) nameEl.textContent = _host;
    }
    const variants = Array.isArray(vars.variants) ? vars.variants : [];

    // This page acts only on its own site, from its own host (the daemon's
    // siteAction); anything else needs a login, which lives on the portal
    // The site token the daemon put in this page: start and restart this site, nothing else
    const apiCall = (endpoint, options = {}) => fetch(API + endpoint, {
      ...options,
      headers: { ...(options.headers || {}), 'X-Candy-Token': window.CANDY_TOKEN || '' },
    });
    const portalBase = `${SCHEME}://portal.${_isBoundDomain ? 'localhost' : TLD}`;
    document.getElementById('terminalLink').href = `${portalBase}/?logs=${encodeURIComponent(serverName)}`;

    document.getElementById('serverName').textContent = serverName;
    document.querySelectorAll('.tld-suffix').forEach(el => el.textContent = '.' + TLD);
    // Stopping needs a login: the portal asks to confirm
    document.getElementById('killBtn').onclick = () => {
      location.href = `${portalBase}/go/kill?name=${encodeURIComponent(serverName)}`;
    };

    function renderChooser() {
      document.title = 'Choose Config';
      const title = document.getElementById('pageTitle');
      title.textContent = 'Choose config for ';
      const span = document.createElement('span');
      span.className = 'domain';
      span.textContent = serverName;
      title.appendChild(span);
      title.appendChild(document.createTextNode('.' + TLD));

      document.getElementById('statusText').textContent = 'Select one variant to start';
      document.getElementById('selectionTitle').textContent = 'Start command';
      document.getElementById('manualPortGroup').style.display = 'none';
      document.getElementById('actionsCard').style.display = 'none';
      const logsEl = document.getElementById('logsContent');
      logsEl.textContent = 'Multiple configs are registered for this name.\nPick one to start. All traffic will route to the chosen running config.';

      const container = document.getElementById('detectedPorts');
      container.innerHTML = '';
      if (!variants.length) {
        container.innerHTML = '<span class="no-ports">No variants available.</span>';
        return;
      }

      for (const variant of variants) {
        const btn = document.createElement('button');
        btn.className = 'port-btn';
        btn.textContent = variant.cwd || variant.id || 'variant';
        btn.title = `${variant.id || ''} ${variant.cmd || ''}`.trim();
        btn.onclick = () => selectVariant(variant.id);
        container.appendChild(btn);
      }
    }

    async function selectVariant(configId) {
      try {
        const res = await apiCall(`/process/start/${serverName}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ configId })
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          alert(data.error || 'Failed to start selected config');
          return;
        }
        location.href = getServiceUrl(returnPath);
      } catch (e) {
        alert('Failed to start selected config: ' + e.message);
      }
    }
    window.selectVariant = selectVariant;

    function updatePorts(ports) {
      const container = document.getElementById('detectedPorts');
      if (ports && ports.length > 0) {
        container.innerHTML = ports.map(port =>
          `<button class="port-btn" onclick="selectPort(${Number(port)})">${Number(port)}</button>`
        ).join('');
      } else {
        container.innerHTML = '<span class="no-ports">Watching the output for a port…</span>';
      }
    }

    if (mode === 'chooser') {
      renderChooser();
    } else {
      updatePorts(vars.detectedPorts);
    }

    async function selectPort(port) {
      document.getElementById('manualPort').value = port;
      await setPort();
    }

    // Picking the port needs a login: it's set from the portal, next to the log
    async function setPort() {
      location.href = `${portalBase}/?logs=${encodeURIComponent(serverName)}`;
    }

    let eventSource = null;
    if (mode === 'starting') {
      eventSource = new EventSource(API + `/stream/${serverName}`);

      eventSource.onmessage = (event) => {
        const content = JSON.parse(event.data);
        const logsEl = document.getElementById('logsContent');
        logsEl.textContent += content;
        logsEl.scrollTop = logsEl.scrollHeight;
      };

      eventSource.addEventListener('status', (event) => {
        const status = JSON.parse(event.data);
        const statusPill = document.getElementById('statusPill');
        const statusText = document.getElementById('statusText');

        if (status.status === 'running' && status.port) {
          statusText.textContent = `Port ${status.port} ready`;
          statusPill.className = 'status-pill success';
          document.getElementById('detectedPort').textContent = status.port;
          document.getElementById('redirectOverlay').classList.add('visible');
          eventSource.close();
          setTimeout(() => {
            location.href = getServiceUrl(returnPath);
          }, 1200);
        } else if (status.status === 'errored' || status.status === 'dead') {
          statusText.textContent = 'Process stopped';
          eventSource.close();
          setTimeout(() => location.reload(), 1500);
        } else {
          updatePorts(status.detectedPorts);
        }
      });

      eventSource.onerror = () => {
        document.getElementById('statusText').textContent = 'Connection lost';
      };
    }

  </script>
</body>
</html>
